<head>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;font-size:14px;background:#f5f5f5;color:#222}
  header{background:#1a1a2e;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
  header h1{font-size:17px;font-weight:700;letter-spacing:.5px}
  header .hdr-meta{font-size:13px;opacity:.7;flex:1}
  .badge{background:#e63946;color:#fff;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700}
  .lang-toggle{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:6px;overflow:hidden;flex-shrink:0}
  .lang-btn{padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;border:none;color:rgba(255,255,255,.6);transition:all .15s}
  .lang-btn.active{background:rgba(255,255,255,.2);color:#fff}
  .container{max-width:1100px;margin:0 auto;padding:24px 16px}

  /* Setup */
  .setup-card{background:#fff;border-radius:12px;padding:40px;max-width:560px;margin:40px auto;box-shadow:0 2px 12px rgba(0,0,0,.1)}
  .setup-card h2{font-size:20px;margin-bottom:8px;color:#1a1a2e}
  .setup-card p{color:#666;margin-bottom:28px;font-size:14px}
  .field{margin-bottom:20px}
  .field label{display:block;font-weight:600;margin-bottom:6px;font-size:13px;color:#444}
  .field select,.field input{width:100%;border:1px solid #ddd;border-radius:6px;padding:10px 12px;font-size:14px;outline:none}
  .field select:focus,.field input:focus{border-color:#1a1a2e}
  .btn{background:#1a1a2e;color:#fff;border:none;border-radius:8px;padding:12px 24px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
  .btn:hover{background:#2d2d4e}
  .btn.outline{background:transparent;color:#1a1a2e;border:2px solid #1a1a2e}
  .btn.outline:hover{background:#f0f0f0}
  .btn.success{background:#2a9d8f}
  .btn.success:hover{background:#21867a}

  /* Layout */
  .layout{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
  .sidebar{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08);position:sticky;top:70px}
  .sidebar-header{background:#1a1a2e;color:#fff;padding:12px 16px;font-size:13px;font-weight:700;display:flex;justify-content:space-between}
  .phase-item{padding:11px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s}
  .phase-item:hover:not(.locked){background:#f8f8f8}
  .phase-item.active{background:#eef2ff;border-left:3px solid #1a1a2e}
  .phase-item.locked{opacity:.42;cursor:not-allowed}
  .phase-name{flex:1;font-size:13px;font-weight:500}
  .phase-count{font-size:11px;color:#999}
  .progress-bar{height:3px;background:#e0e0e0;border-radius:2px;margin-top:3px;overflow:hidden}
  .progress-bar .fill{height:100%;background:#2a9d8f;border-radius:2px;transition:width .3s}

  /* Main */
  .main{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.08);overflow:hidden}
  .phase-header{padding:18px 24px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between}
  .phase-header h2{font-size:16px;font-weight:700;color:#1a1a2e}
  .phase-header .meta{font-size:12px;color:#888;margin-top:2px}
  .phase-actions{display:flex;gap:8px}
  .role-bar{padding:9px 24px;background:#f9f9f9;border-bottom:1px solid #eee;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .role-bar-label{font-size:12px;color:#777;margin-right:2px}
  .role-chip{border:1px solid #ddd;border-radius:14px;padding:3px 12px;font-size:12px;cursor:pointer;background:#fff;transition:all .15s}
  .role-chip.active-chip{background:#1a1a2e;color:#fff;border-color:#1a1a2e}

  /* Blok */
  .blok-group{border-bottom:1px solid #f0f0f0}
  .blok-header{padding:9px 24px;background:#f5f7ff;font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
  .blok-step{background:#1a1a2e;color:#fff;border-radius:4px;padding:1px 7px;font-size:11px}
  .blok-reorder{display:none;gap:4px;margin-left:auto}
  .admin-mode .blok-reorder{display:flex}

  /* Tasks */
  .task-row{display:grid;grid-template-columns:26px 1fr 240px auto;align-items:start;gap:12px;padding:11px 24px;border-bottom:1px solid #f5f5f5;transition:background .1s}
  .task-row:hover{background:#fafafa}
  .task-row.done{background:#f0fdf4}
  .task-row.done .task-name{color:#aaa;text-decoration:line-through}
  .task-check{width:20px;height:20px;border-radius:4px;border:2px solid #ccc;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s;font-size:13px;font-weight:700}
  .task-check.checked{background:#2a9d8f;border-color:#2a9d8f;color:#fff}
  .task-name{font-size:13px;font-weight:500}
  .task-rasci{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
  .rasci-tag{font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700}
  .rasci-R{background:#fce4ec;color:#c62828}
  .rasci-A{background:#e3f2fd;color:#1565c0}
  .rasci-S{background:#e8f5e9;color:#2e7d32}
  .rasci-C{background:#fff8e1;color:#f57f17}
  .task-link-wrap input{width:100%;border:1px solid #e0e0e0;border-radius:6px;padding:6px 9px;font-size:12px;outline:none;color:#444}
  .task-link-wrap input:focus{border-color:#1a1a2e}
  .task-link-wrap input.filled{border-color:#2a9d8f;background:#f0fdf4}
  .task-reorder{display:none;flex-direction:column;gap:2px}
  .admin-mode .task-reorder{display:flex}
  .reorder-btn{background:none;border:none;cursor:pointer;color:#bbb;font-size:11px;padding:2px 4px;border-radius:3px;line-height:1}
  .reorder-btn:hover{background:#eee;color:#555}

  /* Locked */
  .locked-overlay{padding:60px 24px;text-align:center;color:#999}
  .locked-overlay .lock-icon{font-size:44px;margin-bottom:14px}

  /* Export */
  .export-panel{background:#fff;border-radius:10px;padding:18px 24px;margin-top:18px;box-shadow:0 1px 6px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .export-panel p{font-size:13px;color:#666;max-width:460px}
  .stats{display:flex;gap:16px}
  .stat-item .val{font-size:22px;font-weight:700;color:#1a1a2e}
  .stat-item .lbl{font-size:11px;color:#999;text-align:center}
  .stat-item .val.red{color:#e63946}
  .admin-badge{background:#f0c040;color:#7a5c00;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;margin-left:6px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
  .topbar-left{font-size:13px;color:#666}

  @media(max-width:768px){
    .layout{grid-template-columns:1fr}
    .task-row{grid-template-columns:26px 1fr;gap:8px}
    .task-link-wrap{grid-column:1/-1;padding-left:38px}
    .task-reorder{display:none!important}
    .sidebar{position:static}
  }
</style>

      ...task, id: pi+'_'+ti, done: false, link: task.existingLink || ''

}

// ── Helpers ───────────────────────────────────────────────────────────────────
function isPhaseUnlocked(pi) {
  if (pi === 0) return true;
  const prev = getRelevantTasks(pi - 1);
  return prev.length === 0 || prev.every(t => t.done);
}

function getRelevantTasks(pi) {
  const tasks = state.tasks[pi] || [];
  if (state.role === 'all') return tasks;
  return tasks.filter(t => [t.r, t.a, t.s, t.c].some(r => r && r.includes(state.role)));
}

function phaseProgress(pi) {
  const rel = getRelevantTasks(pi);
  if (!rel.length) return 1;
  return rel.filter(t => t.done).length / rel.length;
}

function totalStats() {
  let total=0, done=0, withLink=0;
  PHASES_DATA.forEach((_,pi) => {
    const rel = getRelevantTasks(pi);
    total += rel.length;
    done  += rel.filter(t => t.done).length;
    withLink += rel.filter(t => t.link).length;
  });
  return {total, done, withLink, open: total-done};
}

function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ── Main render ───────────────────────────────────────────────────────────────

  updateHeader();
  const stats = totalStats();
  const oc = document.getElementById('open-count');

  oc.style.display = stats.open > 0 ? 'inline' : 'none';

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="topbar-left">
        ${t('projectLabel')}: <strong>${escH(state.projectName)}</strong> &nbsp;·&nbsp;
        ${t('roleLabel')}: <strong>${state.role==='all' ? t('allRoles') : state.role}</strong>

      <div style="display:flex;gap:8px">
        <button class="btn outline" style="padding:7px 13px;font-size:13px" onclick="goBack()">${t('btnBack')}</button>
        <button class="btn outline" style="padding:7px 13px;font-size:13px" onclick="toggleAdmin()">
          ${state.adminMode ? t('btnAdminOff') : t('btnAdminOn')}
        </button>
      </div>
    </div>
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-header">${t('phasesHeader')} <span style="font-weight:400;opacity:.7">${stats.done}/${stats.total}</span></div>
        ${PHASES_DATA.map((ph,pi) => {
          const unlocked = isPhaseUnlocked(pi);
          const prog = phaseProgress(pi);
          const rel = getRelevantTasks(pi);
          return `<div class="phase-item ${pi===state.currentPhase?'active':''} ${!unlocked?'locked':''}"
            onclick="${unlocked?'selectPhase('+pi+')':''}">
            <span style="font-size:15px">${!unlocked?'🔒':prog>=1?'✅':prog>0?'🔵':'⚪'}</span>
            <div style="flex:1;min-width:0">
              <div class="phase-name">${ph.sheet}</div>
              <div class="progress-bar"><div class="fill" style="width:${Math.round(prog*100)}%"></div></div>
              <div class="phase-count">${rel.filter(t=>t.done).length}/${rel.length} ${t('tasks')}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div>
        <div class="main ${state.adminMode?'admin-mode':''}">
          ${renderPhaseContent(state.currentPhase)}
        </div>
        <div class="export-panel">
          <div>
            <strong style="font-size:15px">${t('exportTitle')}</strong>
            <p>${t('exportDesc')}</p>
          </div>

            <div class="stats">
              <div class="stat-item"><div class="val">${stats.done}</div><div class="lbl">${t('statDone')}</div></div>
              <div class="stat-item"><div class="val">${stats.withLink}</div><div class="lbl">${t('statLink')}</div></div>
              <div class="stat-item"><div class="val red">${stats.open}</div><div class="lbl">${t('statOpen')}</div></div>
            </div>
            <button class="btn success" onclick="exportExcel()">${t('exportBtn')}</button>

        </div>
      </div>
    </div>`;
}

function renderPhaseContent(pi) {
  const ph = PHASES_DATA[pi];
  if (!isPhaseUnlocked(pi)) {
    const prev = PHASES_DATA[pi-1];
    const remaining = getRelevantTasks(pi-1).filter(t=>!t.done).length;
    return `<div class="phase-header"><div><h2>${ph.sheet}</h2><div class="meta">${t('fase')} ${pi+1}</div></div></div>
      <div class="locked-overlay">
        <div class="lock-icon">🔒</div>
        <p>${t('lockedTitle')}</p>
        <p style="font-size:13px;color:#bbb;margin-top:8px">${t('lockedSub')} <strong>${prev.sheet}</strong> (${remaining} ${t('lockedOpen')}).</p>
      </div>`;
  }

  const tasks = state.tasks[pi];
  const rel = getRelevantTasks(pi);
  const doneCount = rel.filter(t=>t.done).length;

  // Build blok groups preserving order
  const seen = [], blokGroups = {};
  tasks.forEach((t, ti) => {
    const k = t.step+'||'+t.blok;
    if (!seen.includes(k)) seen.push(k);
    if (!blokGroups[k]) blokGroups[k] = [];
    blokGroups[k].push({...t, _ti: ti});
  });

  // Role filter chips
  const activeRole = state.role;
  const chipAll = `<span class="role-chip ${activeRole==='all'?'active-chip':''}" onclick="filterRole('all')">${t('filterAll')}</span>`;
  const chipRoles = ROLES.map(r =>
    `<span class="role-chip ${activeRole===r?'active-chip':''}" onclick="filterRole('${r}')">${r}</span>`
  ).join('');

  let html = `
    <div class="phase-header">
      <div><h2>${ph.sheet}</h2><div class="meta">${doneCount} ${t('tasksDone')} (${rel.length} ${t('tasks')})</div></div>
      <div class="phase-actions">
        <button class="btn outline" style="padding:6px 11px;font-size:12px" onclick="markAll(${pi},true)">${t('btnMarkAll')}</button>
        <button class="btn outline" style="padding:6px 11px;font-size:12px" onclick="markAll(${pi},false)">${t('btnUnmarkAll')}</button>
      </div>
    </div>
    <div class="role-bar"><span class="role-bar-label">${t('filterLabel')}</span>${chipAll}${chipRoles}</div>`;

  seen.forEach((blokKey, blokIdx) => {
    const [step, blok] = blokKey.split('||');
    const blokTasks = blokGroups[blokKey] || [];
    const filtered = activeRole==='all' ? blokTasks
      : blokTasks.filter(t => [t.r,t.a,t.s,t.c].some(r=>r&&r.includes(activeRole)));
    if (!filtered.length) return;

    html += `<div class="blok-group">
      <div class="blok-header">
        <span class="blok-step">${step}</span>${blok}
        <div class="blok-reorder">
          ${blokIdx>0?`<button class="reorder-btn" onclick="moveBlok(${pi},'${blokKey}',-1)">▲</button>`:''}
          ${blokIdx<seen.length-1?`<button class="reorder-btn" onclick="moveBlok(${pi},'${blokKey}',1)">▼</button>`:''}
        </div>
      </div>`;

    filtered.forEach(t => {
      const ti = t._ti;
      const task = state.tasks[pi][ti];
      const tags = [
        t.r?`<span class="rasci-tag rasci-R">R: ${t.r}</span>`:'',
        t.a?`<span class="rasci-tag rasci-A">A: ${t.a}</span>`:'',
        t.s?`<span class="rasci-tag rasci-S">S: ${t.s}</span>`:'',
        t.c?`<span class="rasci-tag rasci-C">C: ${t.c}</span>`:'',
      ].filter(Boolean).join('');

      html += `<div class="task-row ${task.done?'done':''}">
        <div class="task-check ${task.done?'checked':''}" onclick="toggleTask(${pi},${ti})">${task.done?'✓':''}</div>
        <div>
          <div class="task-name">${escH(t.deliverable)}</div>
          <div class="task-rasci">${tags}</div>
        </div>
        <div class="task-link-wrap">
          <input type="text" placeholder="${t('linkPlaceholder')}" value="${escH(task.link)}"
            class="${task.link?'filled':''}"
            oninput="updateLink(${pi},${ti},this.value)">
        </div>
        <div class="task-reorder">
          ${ti>0?`<button class="reorder-btn" onclick="moveTask(${pi},${ti},-1)">▲</button>`:'<span> </span>'}
          ${ti<tasks.length-1?`<button class="reorder-btn" onclick="moveTask(${pi},${ti},1)">▼</button>`:'<span> </span>'}
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  return html;
}

// ── Actions ───────────────────────────────────────────────────────────────────
function goBack(){ state.setupDone=false; renderSetup(); }
function selectPhase(pi){ state.currentPhase=pi; renderApp(); }
function toggleAdmin(){ state.adminMode=!state.adminMode; updateHeader(); renderApp(); }
function filterRole(r){ state.role=r; renderApp(); }

function toggleTask(pi,ti){
  state.tasks[pi][ti].done = !state.tasks[pi][ti].done;
  renderApp();
}

function updateLink(pi,ti,val){
  state.tasks[pi][ti].link = val;
  event.target.classList.toggle('filled', !!val);
}

function markAll(pi, done){
  getRelevantTasks(pi).forEach(t => {
    const ti = state.tasks[pi].findIndex(x => x.id===t.id);
    if (ti>=0) state.tasks[pi][ti].done = done;
  });
  renderApp();
}

function moveTask(pi,ti,dir){
  const tasks = state.tasks[pi];
  const ni = ti+dir;
  if (ni<0||ni>=tasks.length) return;
  [tasks[ti],tasks[ni]] = [tasks[ni],tasks[ti]];
  renderApp();
}

function moveBlok(pi,blokKey,dir){
  const tasks = state.tasks[pi];
  const order = [...new Set(tasks.map(t=>t.step+'||'+t.blok))];
  const idx = order.indexOf(blokKey);
  const ni = idx+dir;
  if (ni<0||ni>=order.length) return;
  [order[idx],order[ni]] = [order[ni],order[idx]];
  const groups = {};
  tasks.forEach(t=>{ const k=t.step+'||'+t.blok; if(!groups[k]) groups[k]=[]; groups[k].push(t); });
  state.tasks[pi] = order.flatMap(k => groups[k]||[]);
  renderApp();
}

// ── Excel Export ──────────────────────────────────────────────────────────────
function exportExcel(){
  const wb = XLSX.utils.book_new();
  const today = new Date().toLocaleDateString('nl-NL');

  const instrWs = XLSX.utils.aoa_to_sheet([
    ['Fasedocument Tracker — Export'],[''],
    [t('projectLabel')+': '+state.projectName],
    ['Export: '+today]
  ]);
  XLSX.utils.book_append_sheet(wb, instrWs, 'Gebruiksaanwijzing');

  PHASES_DATA.forEach((ph,pi) => {
    const rows = [['Processtap','Blok','Deliverable','Omschrijving / Link','R','A','S','C','I','opm']];
    state.tasks[pi].forEach(t => {
      rows.push([t.step,t.blok,t.deliverable,t.link||'',t.r,t.a,t.s,t.c,t.i,t.opm||'']);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:12},{wch:35},{wch:45},{wch:50},{wch:6},{wch:6},{wch:6},{wch:6},{wch:6},{wch:20}];
    XLSX.utils.book_append_sheet(wb, ws, ph.sheet);
  });

  const safe = state.projectName.replace(/[^a-zA-Z0-9]/g,'_');
  const date = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `fasedocument_${safe}_${date}.xlsx`);
}

init();
</script>
