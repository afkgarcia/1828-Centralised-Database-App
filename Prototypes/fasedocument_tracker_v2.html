<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1828 — Fasedocument Tracker v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;font-size:14px;background:#f5f5f5;color:#222}
  header{background:#1a1a2e;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
  header h1{font-size:17px;font-weight:700;letter-spacing:.5px}
  header .hdr-meta{font-size:13px;opacity:.7;flex:1}
  .badge{background:#e63946;color:#fff;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700}
  .v-badge{background:#f0c040;color:#7a5c00;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}
  .lang-toggle{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:6px;overflow:hidden;flex-shrink:0}
  .lang-btn{padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;border:none;color:rgba(255,255,255,.6);transition:all .15s}
  .lang-btn.active{background:rgba(255,255,255,.2);color:#fff}
  .container{max-width:1180px;margin:0 auto;padding:24px 16px}

  /* Setup */
  .setup-card{background:#fff;border-radius:12px;padding:40px;max-width:560px;margin:40px auto;box-shadow:0 2px 12px rgba(0,0,0,.1)}
  .setup-card h2{font-size:20px;margin-bottom:8px;color:#1a1a2e}
  .setup-card p{color:#666;margin-bottom:28px;font-size:14px}
  .field{margin-bottom:20px}
  .field label{display:block;font-weight:600;margin-bottom:6px;font-size:13px;color:#444}
  .field select,.field input{width:100%;border:1px solid #ddd;border-radius:6px;padding:10px 12px;font-size:14px;outline:none}
  .field select:focus,.field input:focus{border-color:#1a1a2e}
  .btn{background:#1a1a2e;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
  .btn:hover{background:#2d2d4e}
  .btn.outline{background:transparent;color:#1a1a2e;border:2px solid #1a1a2e}
  .btn.outline:hover{background:#f0f0f0}
  .btn.success{background:#2a9d8f}
  .btn.success:hover{background:#21867a}
  .btn.danger{background:#c0392b}
  .btn.danger:hover{background:#a13226}
  .btn.tiny{padding:5px 10px;font-size:12px;border-radius:6px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  /* Layout */
  .layout{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
  .sidebar{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08);position:sticky;top:70px;max-height:calc(100vh - 90px);overflow-y:auto}
  .sidebar-section{border-bottom:1px solid #eee}
  .sidebar-header{background:#1a1a2e;color:#fff;padding:11px 16px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sidebar-header.cities{background:#0e7490}
  .sidebar-header.projects{background:#1a1a2e}
  .add-pill{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:14px;padding:2px 10px;font-size:11px;font-weight:700;cursor:pointer}
  .add-pill:hover{background:rgba(255,255,255,.32)}
  .sb-item{padding:10px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s}
  .sb-item:hover{background:#f8f8f8}
  .sb-item.active{background:#eef2ff;border-left:3px solid #1a1a2e}
  .sb-item.active.city{border-left-color:#0e7490;background:#ecfeff}
  .sb-name{flex:1;font-size:13px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-count{font-size:11px;color:#999}
  .progress-bar{height:3px;background:#e0e0e0;border-radius:2px;margin-top:3px;overflow:hidden}
  .progress-bar .fill{height:100%;background:#2a9d8f;border-radius:2px;transition:width .3s}
  .progress-bar .fill.city{background:#0e7490}
  .sb-empty{padding:14px 16px;color:#999;font-size:12px;font-style:italic}

  /* Main */
  .main{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.08);overflow:hidden}
  .crumbs{padding:10px 24px 0;font-size:12px;color:#888}
  .crumbs strong{color:#444}
  .phase-header{padding:16px 24px;border-bottom:1px solid #eee;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .phase-header h2{font-size:17px;font-weight:700;color:#1a1a2e}
  .phase-header .meta{font-size:12px;color:#888;margin-top:3px}
  .phase-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* Phase tabs (inside a project) */
  .phase-tabs{display:flex;gap:4px;padding:10px 18px;background:#fafafa;border-bottom:1px solid #eee;overflow-x:auto;flex-wrap:wrap}
  .ptab{border:1px solid #ddd;background:#fff;border-radius:18px;padding:6px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s}
  .ptab:hover:not(.locked){background:#f0f0f0}
  .ptab.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
  .ptab.locked{opacity:.45;cursor:not-allowed}
  .ptab.approved{background:#e8f8f4;border-color:#2a9d8f;color:#1d6f63}
  .ptab.approved.active{background:#2a9d8f;color:#fff}
  .ptab .pdot{font-size:11px}

  .role-bar{padding:8px 24px;background:#f9f9f9;border-bottom:1px solid #eee;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .role-bar-label{font-size:12px;color:#777;margin-right:2px}
  .role-chip{border:1px solid #ddd;border-radius:14px;padding:3px 12px;font-size:12px;cursor:pointer;background:#fff;transition:all .15s}
  .role-chip.active-chip{background:#1a1a2e;color:#fff;border-color:#1a1a2e}

  /* Approval banner */
  .approval-banner{padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .approval-banner.ready{background:#fff8e1;border-bottom:1px solid #f0c040}
  .approval-banner.submitted{background:#fef3c7;border-bottom:1px solid #f59e0b}
  .approval-banner.approved{background:#ecfdf5;border-bottom:1px solid #2a9d8f}
  .approval-banner .ab-text{flex:1;font-size:13px;color:#444}
  .approval-banner .ab-text strong{color:#1a1a2e}

  /* Blok */
  .blok-group{border-bottom:1px solid #f0f0f0}
  .blok-header{padding:9px 24px;background:#f5f7ff;font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
  .blok-step{background:#1a1a2e;color:#fff;border-radius:4px;padding:1px 7px;font-size:11px}
  .blok-reorder{display:none;gap:4px;margin-left:auto;align-items:center}
  .admin-mode .blok-reorder{display:flex}
  .add-row-btn{background:#fff;border:1px dashed #aaa;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;color:#444;font-weight:600}
  .add-row-btn:hover{background:#f0f0f0;border-color:#1a1a2e}

  /* Tasks: tri-state */
  .task-row{display:grid;grid-template-columns:auto 1fr 240px auto;align-items:start;gap:12px;padding:11px 24px;border-bottom:1px solid #f5f5f5;transition:background .1s}
  .task-row:hover{background:#fafafa}
  .task-row.done{background:#f0fdf4}
  .task-row.done .task-name{color:#888;text-decoration:line-through}
  .task-row.na{background:#f5f5f5;opacity:.62}
  .task-row.na .task-name{color:#999;text-decoration:line-through;font-style:italic}
  .task-row.na .task-rasci{opacity:.5}
  .task-row.na .task-link-wrap input{background:#eee;color:#888}
  .task-row.custom{background:#fff8ee}
  .task-row.custom.done{background:#f0fdf4}
  .task-row.custom.na{background:#f5f5f5}

  .tri-cell{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:42px;padding-top:1px}
  .tri-btn{width:22px;height:22px;border-radius:4px;border:2px solid #ccc;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#fff;transition:all .15s;color:#999}
  .tri-btn.checked{background:#2a9d8f;border-color:#2a9d8f;color:#fff}
  .tri-btn.na{background:#999;border-color:#999;color:#fff}
  .na-toggle{font-size:9px;color:#888;cursor:pointer;border:1px solid #ccc;border-radius:9px;padding:1px 6px;background:#fff;font-weight:600;letter-spacing:.3px}
  .na-toggle.on{background:#999;color:#fff;border-color:#777}
  .na-toggle:hover{border-color:#1a1a2e}

  .task-name{font-size:13px;font-weight:500}
  .custom-tag{display:inline-block;background:#f0c040;color:#5a4400;font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:6px;letter-spacing:.4px}
  .task-rasci{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;align-items:center}
  .rasci-tag{font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700}
  .rasci-R{background:#fce4ec;color:#c62828}
  .rasci-A{background:#e3f2fd;color:#1565c0}
  .rasci-S{background:#e8f5e9;color:#2e7d32}
  .rasci-C{background:#fff8e1;color:#f57f17}
  .task-link-wrap input{width:100%;border:1px solid #e0e0e0;border-radius:6px;padding:6px 9px;font-size:12px;outline:none;color:#444}
  .task-link-wrap input:focus{border-color:#1a1a2e}
  .task-link-wrap input.filled{border-color:#2a9d8f;background:#f0fdf4}
  .task-aside{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .task-reorder{display:none;flex-direction:column;gap:2px}
  .admin-mode .task-reorder{display:flex}
  .reorder-btn{background:none;border:none;cursor:pointer;color:#bbb;font-size:11px;padding:2px 4px;border-radius:3px;line-height:1}
  .reorder-btn:hover{background:#eee;color:#555}
  .delete-btn{display:none;background:none;border:none;color:#c0392b;cursor:pointer;font-size:13px;padding:2px 6px;border-radius:3px}
  .admin-mode .task-row.custom .delete-btn{display:inline-block}
  .delete-btn:hover{background:#fee}

  /* Empty state */
  .empty-state{padding:80px 24px;text-align:center;color:#999}
  .empty-state .big{font-size:48px;margin-bottom:12px}
  .empty-state h3{font-size:16px;color:#666;margin-bottom:6px}

  /* Welcome / mode picker */
  .welcome{padding:40px 24px}
  .welcome h2{font-size:20px;color:#1a1a2e;margin-bottom:6px}
  .welcome p{color:#666;font-size:14px;margin-bottom:18px}
  .picker{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pick-card{border:2px solid #eee;border-radius:10px;padding:18px;cursor:pointer;transition:all .15s;background:#fff}
  .pick-card:hover{border-color:#1a1a2e;background:#fafafa}
  .pick-card h3{font-size:15px;color:#1a1a2e;margin-bottom:4px}
  .pick-card .pc-icon{font-size:28px;margin-bottom:6px}
  .pick-card.cities:hover{border-color:#0e7490}
  .pick-card p{font-size:12px;color:#777}

  /* Export */
  .export-panel{background:#fff;border-radius:10px;padding:16px 24px;margin-top:18px;box-shadow:0 1px 6px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .export-panel p{font-size:13px;color:#666;max-width:460px}
  .stats{display:flex;gap:16px}
  .stat-item .val{font-size:22px;font-weight:700;color:#1a1a2e}
  .stat-item .lbl{font-size:11px;color:#999;text-align:center}
  .stat-item .val.red{color:#e63946}
  .stat-item .val.grey{color:#888}
  .stat-item .val.green{color:#2a9d8f}
  .admin-badge{background:#f0c040;color:#7a5c00;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;margin-left:6px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .topbar-left{font-size:13px;color:#666}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200}
  .modal{background:#fff;border-radius:10px;padding:22px;max-width:420px;width:90%}
  .modal h3{font-size:16px;margin-bottom:10px;color:#1a1a2e}
  .modal p{font-size:13px;color:#555;margin-bottom:14px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

  @media(max-width:820px){
    .layout{grid-template-columns:1fr}
    .sidebar{position:static;max-height:none}
    .task-row{grid-template-columns:auto 1fr;gap:8px}
    .task-link-wrap{grid-column:1/-1;padding-left:54px}
    .task-aside{grid-column:2;justify-self:end}
    .picker{grid-template-columns:1fr}
  }
</style>
</head>

</header>
<div class="container" id="app"></div>

  view: null,                              // {type:'city'|'project', id, phaseIdx?}
  cities: {},                              // name -> {tasks:[...]}
  cityOrder: [],
  projects: {},                            // name -> {phases:[{tasks,submitted,approved}, ...]}
  projectOrder: [],
};

// ── Task factory ─────────────────────────────────────────────────────────────
function makeTaskList(srcTasks, prefix){
  return srcTasks.map((task, i) => ({
    ...task,
    id: prefix + '_b_' + i,
    status: 'open',                         // 'open' | 'done' | 'na'
    link: task.existingLink || '',
    custom: false,
  }));
}

function makeCustomTask(blokKey, deliverable){
  const [step, blok] = blokKey.split('||');
  return {
    row: 0, step, blok, deliverable,
    r:'', a:'', s:'', c:'', i:'', opm:'',
    id: 'c_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    status: 'open',
    link: '',
    custom: true,
  };
}

// ── Init ─────────────────────────────────────────────────────────────────────
function init(){
  // Seed two demo cities so the structural difference is visible.
  ['Leiden','Amsterdam'].forEach(c => addCityInternal(c));
  // Seed one demo project.
  addProjectInternal('Utrecht Oost');
  renderSetup();
}

function addCityInternal(name){
  if (state.cities[name]) return false;
  state.cities[name] = { tasks: makeTaskList(CITY_PHASE.tasks, 'city_'+name) };
  state.cityOrder.push(name);
  return true;
}

function addProjectInternal(name){
  if (state.projects[name]) return false;
  state.projects[name] = {
    phases: PROJECT_PHASES.map((ph, pi) => ({
      tasks: makeTaskList(ph.tasks, 'proj_'+name+'_p'+pi),
      submitted: false,
      approved: false,
    }))
  };
  state.projectOrder.push(name);
  return true;
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function isApprover(){ return state.adminMode || state.role === 'MT' || state.role === 'all'; }

function relevantTasks(tasks){
  if (state.role === 'all') return tasks;
  return tasks.filter(x => [x.r, x.a, x.s, x.c].some(r => r && r.includes(state.role)));
}

function progressOf(tasks){
  const rel = relevantTasks(tasks);
  const applicable = rel.filter(x => x.status !== 'na');
  if (!applicable.length) return 1;          // nothing applicable = treat as complete
  return applicable.filter(x => x.status === 'done').length / applicable.length;
}

function isPhaseUnlocked(projName, phaseIdx){
  if (phaseIdx === 0) return true;
  return state.projects[projName].phases[phaseIdx - 1].approved;
}

function isPhaseReady(phase){
  // ready = at least one applicable task and all relevant tasks are non-open
  const rel = relevantTasks(phase.tasks);
  if (!rel.length) return false;
  const open = rel.filter(x => x.status === 'open').length;
  return open === 0;
}

function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function setLang(l){
  lang = l;
  document.getElementById('btn-nl').classList.toggle('active', l==='nl');
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.querySelector('title').textContent = t('appTitle');
  if (!state.setupDone) renderSetup(); else renderApp();
}

// ── Setup ────────────────────────────────────────────────────────────────────
function renderSetup(){
  document.getElementById('hdr-meta').textContent = '';
  document.getElementById('admin-badge-hdr').innerHTML = '';
  document.getElementById('open-count').style.display = 'none';
  document.getElementById('app').innerHTML = `
    <div class="setup-card">
      <h2>${t('setupTitle')}</h2>
      <p>${t('setupSub')}</p>
      <div class="field">
        <label>${t('labelRole')}</label>
        <select id="s-role">
          <option value="all">${t('roleAll')}</option>
          <option value="OM">${t('roleOM')}</option>
          <option value="PO">${t('rolePO')}</option>
          <option value="PM">${t('rolePM')}</option>
          <option value="PPM">${t('rolePPM')}</option>
          <option value="MT">${t('roleMT')}</option>
        </select>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
        <button class="btn" onclick="startApp()">${t('btnStart')}</button>
        <button class="btn outline" onclick="toggleAdminSetup()">${t('btnAdmin')}</button>
      </div>
      <p id="admin-note" style="display:${state.adminMode?'block':'none'};color:#e67e22;margin-top:12px;font-size:13px">${t('adminNote')}</p>
    </div>`;

  }
}

function toggleAdminSetup(){
  state.adminMode = !state.adminMode;
  const n = document.getElementById('admin-note');
  if (n){ n.textContent = t('adminNote'); n.style.display = state.adminMode ? 'block':'none'; }
}

function startApp(){
  state.role = document.getElementById('s-role').value;
  state.setupDone = true;
  state.view = null;
  updateHeader();
  renderApp();
}

function updateHeader(){
  const role = state.role==='all' ? t('filterAll') : state.role;
  document.getElementById('hdr-meta').textContent = `${t('labelRole').replace(':','')}: ${role}`;
  document.getElementById('admin-badge-hdr').innerHTML =
    state.adminMode ? `<span class="admin-badge">${t('adminBadge')}</span>` : '';
}

// ── Top-level render ─────────────────────────────────────────────────────────
function renderApp(){
  updateHeader();

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="topbar-left">
        ${t('labelRole').replace(':','')}: <strong>${state.role==='all'?t('filterAll'):state.role}</strong>
        ${isApprover() ? ` &nbsp;·&nbsp; <span style="color:#0e7490;font-weight:700">${t('approver')}</span>` : ''}
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn outline tiny" onclick="goBack()">${t('btnBack')}</button>
        <button class="btn outline tiny" onclick="toggleAdmin()">${state.adminMode?t('btnAdminOff'):t('btnAdminOn')}</button>
      </div>
    </div>
    <div class="layout">
      <div class="sidebar">${renderSidebar()}</div>
      <div>
        <div class="main ${state.adminMode?'admin-mode':''}">${renderMain()}</div>
        ${renderExportPanel()}
      </div>
    </div>`;
}

function renderSidebar(){
  // Cities section
  const cityRows = state.cityOrder.length === 0
    ? `<div class="sb-empty">${t('noCities')}</div>`
    : state.cityOrder.map(name => {
        const tasks = state.cities[name].tasks;
        const rel = relevantTasks(tasks);
        const applicable = rel.filter(x=>x.status!=='na');
        const done = applicable.filter(x=>x.status==='done').length;
        const prog = progressOf(tasks);
        const active = state.view && state.view.type==='city' && state.view.id===name;
        return `<div class="sb-item ${active?'active city':''}" onclick="openCity('${escAttr(name)}')">
          <span style="font-size:14px">${prog>=1?'✅':prog>0?'🔵':'⚪'}</span>
          <div style="flex:1;min-width:0">
            <div class="sb-name" title="${escH(name)}">${escH(name)}</div>
            <div class="progress-bar"><div class="fill city" style="width:${Math.round(prog*100)}%"></div></div>
            <div class="sb-count">${done}/${applicable.length} ${t('tasks')}</div>
          </div>
        </div>`;
      }).join('');

  // Projects section
  const projRows = state.projectOrder.length === 0
    ? `<div class="sb-empty">${t('noProjects')}</div>`
    : state.projectOrder.map(name => {
        const proj = state.projects[name];
        const totalApplicable = proj.phases.reduce((acc,ph)=> acc + relevantTasks(ph.tasks).filter(x=>x.status!=='na').length, 0);
        const totalDone = proj.phases.reduce((acc,ph)=> acc + relevantTasks(ph.tasks).filter(x=>x.status==='done').length, 0);
        const approvedCount = proj.phases.filter(p=>p.approved).length;
        const prog = totalApplicable ? totalDone/totalApplicable : 0;
        const active = state.view && state.view.type==='project' && state.view.id===name;
        return `<div class="sb-item ${active?'active':''}" onclick="openProject('${escAttr(name)}')">
          <span style="font-size:14px">${approvedCount===proj.phases.length?'🏁':approvedCount>0?'🔵':'⚪'}</span>
          <div style="flex:1;min-width:0">
            <div class="sb-name" title="${escH(name)}">${escH(name)}</div>
            <div class="progress-bar"><div class="fill" style="width:${Math.round(prog*100)}%"></div></div>
            <div class="sb-count">${approvedCount}/${proj.phases.length} ${t('fase').toLowerCase()}n · ${totalDone}/${totalApplicable} ${t('tasks')}</div>
          </div>
        </div>`;
      }).join('');

  return `
    <div class="sidebar-section">
      <div class="sidebar-header cities">
        <span>${t('cities')} <span style="font-weight:400;opacity:.7">${state.cityOrder.length}</span></span>
        <button class="add-pill" onclick="promptAddCity()">${t('addCity')}</button>
      </div>
      ${cityRows}
    </div>
    <div class="sidebar-section">
      <div class="sidebar-header projects">
        <span>${t('projects')} <span style="font-weight:400;opacity:.7">${state.projectOrder.length}</span></span>
        <button class="add-pill" onclick="promptAddProject()">${t('addProject')}</button>
      </div>
      ${projRows}
    </div>`;
}

function escAttr(s){ return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

// ── Main panel ───────────────────────────────────────────────────────────────
function renderMain(){
  if (!state.view) return renderWelcome();
  if (state.view.type === 'city') return renderCity(state.view.id);
  if (state.view.type === 'project') return renderProject(state.view.id);
  return '';
}

function renderWelcome(){
  return `<div class="welcome">
    <h2>${t('welcomeTitle')}</h2>
    <p>${t('welcomeSub')}</p>
    <div class="picker">
      <div class="pick-card cities" onclick="promptAddCity()">
        <div class="pc-icon">🏙️</div>
        <h3>${t('pickCity')}</h3>
        <p>${t('pickCityDesc')}</p>
      </div>
      <div class="pick-card" onclick="promptAddProject()">
        <div class="pc-icon">🏗️</div>
        <h3>${t('pickProject')}</h3>
        <p>${t('pickProjectDesc')}</p>
      </div>
    </div>
  </div>`;
}

function renderCity(name){
  const city = state.cities[name];
  if (!city) { state.view = null; return renderWelcome(); }
  const tasks = city.tasks;
  const rel = relevantTasks(tasks);
  const applicable = rel.filter(x=>x.status!=='na');
  const done = applicable.filter(x=>x.status==='done').length;
  const naCount = rel.filter(x=>x.status==='na').length;

  let html = `
    <div class="crumbs">${t('crumbCities')} / <strong>${escH(name)}</strong></div>
    <div class="phase-header">
      <div>
        <h2>🏙️ ${escH(name)} — ${escH(CITY_PHASE.sheet)}</h2>
        <div class="meta">${done} ${t('of')} ${applicable.length} ${t('applicable')} · ${naCount} ${t('statNa')} · ${rel.length} ${t('tasks')}</div>
      </div>
      <div class="phase-actions">
        <button class="btn outline tiny" onclick="markAllInList('city','${escAttr(name)}',null,'done')">${t('btnMarkAll')}</button>
        <button class="btn outline tiny" onclick="markAllInList('city','${escAttr(name)}',null,'open')">${t('btnUnmarkAll')}</button>
      </div>
    </div>
    ${renderRoleBar()}
    ${renderTaskList(tasks, {ctxType:'city', ctxId:name, phaseIdx:null})}`;
  return html;
}

function renderProject(name){
  const proj = state.projects[name];
  if (!proj) { state.view = null; return renderWelcome(); }
  let phaseIdx = state.view.phaseIdx ?? 0;
  if (phaseIdx >= proj.phases.length) phaseIdx = 0;
  state.view.phaseIdx = phaseIdx;

  // Phase tabs
  const tabs = proj.phases.map((ph, pi) => {
    const unlocked = isPhaseUnlocked(name, pi);
    const cls = [
      'ptab',
      pi === phaseIdx ? 'active' : '',
      !unlocked ? 'locked' : '',
      ph.approved ? 'approved' : '',
    ].filter(Boolean).join(' ');
    const dot = !unlocked ? '🔒' : ph.approved ? '✅' : ph.submitted ? '🟡' : isPhaseReady(ph) ? '🟢' : (relevantTasks(ph.tasks).some(x=>x.status==='done') ? '🔵' : '⚪');
    const onclick = unlocked ? `selectPhase(${pi})` : '';
    return `<div class="${cls}" onclick="${onclick}">
      <span class="pdot">${dot}</span>
      <span>${pi+1}. ${escH(PROJECT_PHASES[pi].sheet)}</span>
    </div>`;
  }).join('');

  const phase = proj.phases[phaseIdx];
  const phaseSheet = PROJECT_PHASES[phaseIdx];
  const unlocked = isPhaseUnlocked(name, phaseIdx);

  let body = '';
  if (!unlocked){
    body = `<div class="empty-state">
      <div class="big">🔒</div>
      <h3>${t('lockedTitle')}</h3>
      <p>${t('lockedSub')}</p>
    </div>`;
  } else {
    const rel = relevantTasks(phase.tasks);
    const applicable = rel.filter(x=>x.status!=='na');
    const done = applicable.filter(x=>x.status==='done').length;
    const naCount = rel.filter(x=>x.status==='na').length;
    const ready = isPhaseReady(phase);

    let banner = '';
    if (phase.approved){
      banner = `<div class="approval-banner approved">
        <div class="ab-text"><strong>✅ ${t('approvedTitle')}.</strong> ${t('approvedDesc')}</div>
        ${isApprover() ? `<button class="btn outline tiny" onclick="reopenPhase('${escAttr(name)}',${phaseIdx})">${t('reopenPhase')}</button>` : ''}
      </div>`;
    } else if (phase.submitted){
      banner = `<div class="approval-banner submitted">
        <div class="ab-text"><strong>🟡 ${t('submittedTitle')}.</strong> ${t('submittedDesc')}</div>
        ${isApprover()
          ? `<button class="btn success tiny" onclick="approvePhase('${escAttr(name)}',${phaseIdx})">${t('approvePhase')}</button>
             <button class="btn danger tiny" onclick="rejectPhase('${escAttr(name)}',${phaseIdx})">${t('rejectPhase')}</button>`
          : `<button class="btn outline tiny" onclick="withdrawPhase('${escAttr(name)}',${phaseIdx})">${t('withdraw')}</button>
             <span style="font-size:11px;color:#888">${t('needsApprover')}</span>`}
      </div>`;
    } else if (ready){
      banner = `<div class="approval-banner ready">
        <div class="ab-text"><strong>${t('readyTitle')}</strong> ${t('readyDesc')}</div>
        <button class="btn tiny" onclick="submitPhase('${escAttr(name)}',${phaseIdx})">${t('submitForApproval')}</button>
      </div>`;
    }

    body = `${banner}${renderRoleBar()}${renderTaskList(phase.tasks, {ctxType:'project', ctxId:name, phaseIdx})}`;
  }

  return `
    <div class="crumbs">${t('crumbProjects')} / <strong>${escH(name)}</strong></div>
    <div class="phase-header">
      <div>
        <h2>🏗️ ${escH(name)} — ${t('fase')} ${phaseIdx+1}: ${escH(phaseSheet.sheet)}</h2>
        <div class="meta">${unlocked ? renderPhaseMeta(phase) : t('lockedTitle')}</div>
      </div>
      <div class="phase-actions">
        ${unlocked && !phase.approved && !phase.submitted ? `
          <button class="btn outline tiny" onclick="markAllInList('project','${escAttr(name)}',${phaseIdx},'done')">${t('btnMarkAll')}</button>
          <button class="btn outline tiny" onclick="markAllInList('project','${escAttr(name)}',${phaseIdx},'open')">${t('btnUnmarkAll')}</button>` : ''}
      </div>
    </div>
    <div class="phase-tabs">${tabs}</div>
    ${body}`;
}

function renderPhaseMeta(phase){
  const rel = relevantTasks(phase.tasks);
  const applicable = rel.filter(x=>x.status!=='na');
  const done = applicable.filter(x=>x.status==='done').length;
  const naCount = rel.filter(x=>x.status==='na').length;
  return `${done} ${t('of')} ${applicable.length} ${t('applicable')} · ${naCount} ${t('statNa')}`;
}

function renderRoleBar(){
  const chipAll = `<span class="role-chip ${state.role==='all'?'active-chip':''}" onclick="filterRole('all')">${t('filterAll')}</span>`;
  const chipRoles = ROLES.map(r =>
    `<span class="role-chip ${state.role===r?'active-chip':''}" onclick="filterRole('${r}')">${r}</span>`).join('');
  return `<div class="role-bar"><span class="role-bar-label">${t('filterLabel')}</span>${chipAll}${chipRoles}</div>`;
}

// ── Task list rendering ──────────────────────────────────────────────────────
function getTaskArray(ctx){
  if (ctx.ctxType === 'city') return state.cities[ctx.ctxId].tasks;
  return state.projects[ctx.ctxId].phases[ctx.phaseIdx].tasks;
}

function setTaskArray(ctx, arr){
  if (ctx.ctxType === 'city') state.cities[ctx.ctxId].tasks = arr;
  else state.projects[ctx.ctxId].phases[ctx.phaseIdx].tasks = arr;
}

function renderTaskList(tasks, ctx){
  // Group by step||blok preserving order
  const seen = [], groups = {};
  tasks.forEach((task, ti) => {
    const k = task.step + '||' + task.blok;
    if (!seen.includes(k)) seen.push(k);
    (groups[k] = groups[k] || []).push({ ...task, _ti: ti });
  });

  const phaseLocked = ctx.ctxType === 'project'
    && (state.projects[ctx.ctxId].phases[ctx.phaseIdx].approved
        || state.projects[ctx.ctxId].phases[ctx.phaseIdx].submitted);

  const ctxStr = `'${ctx.ctxType}','${escAttr(ctx.ctxId)}',${ctx.phaseIdx===null?'null':ctx.phaseIdx}`;

  let html = '';
  seen.forEach((blokKey, blokIdx) => {
    const [step, blok] = blokKey.split('||');
    const blokTasks = groups[blokKey] || [];
    const filtered = state.role === 'all' ? blokTasks
      : blokTasks.filter(x => [x.r,x.a,x.s,x.c].some(r => r && r.includes(state.role)));
    if (!filtered.length && state.role !== 'all') return;

    html += `<div class="blok-group">
      <div class="blok-header">
        <span class="blok-step">${escH(step)}</span>${escH(blok)}
        <div class="blok-reorder">
          ${blokIdx>0?`<button class="reorder-btn" onclick="moveBlok(${ctxStr},'${escAttr(blokKey)}',-1)">▲</button>`:''}
          ${blokIdx<seen.length-1?`<button class="reorder-btn" onclick="moveBlok(${ctxStr},'${escAttr(blokKey)}',1)">▼</button>`:''}
          ${state.adminMode && !phaseLocked ? `<button class="add-row-btn" onclick="promptAddRow(${ctxStr},'${escAttr(blokKey)}')">${t('addRow')}</button>` : ''}
        </div>
      </div>`;

    filtered.forEach(task => {
      const ti = task._ti;
      const fullTask = tasks[ti];
      const tags = [
        task.r?`<span class="rasci-tag rasci-R">R: ${escH(task.r)}</span>`:'',
        task.a?`<span class="rasci-tag rasci-A">A: ${escH(task.a)}</span>`:'',
        task.s?`<span class="rasci-tag rasci-S">S: ${escH(task.s)}</span>`:'',
        task.c?`<span class="rasci-tag rasci-C">C: ${escH(task.c)}</span>`:'',
      ].filter(Boolean).join('');
      const customTag = fullTask.custom ? `<span class="custom-tag">${t('customTag')}</span>` : '';
      const rowCls = ['task-row',
        fullTask.status==='done'?'done':'',
        fullTask.status==='na'?'na':'',
        fullTask.custom?'custom':'',
      ].filter(Boolean).join(' ');

      const triBtnCls = ['tri-btn',
        fullTask.status==='done'?'checked':'',
        fullTask.status==='na'?'na':'',
      ].filter(Boolean).join(' ');
      const triGlyph = fullTask.status==='done' ? '✓' : fullTask.status==='na' ? '⊘' : '';
      const naCls = 'na-toggle' + (fullTask.status==='na' ? ' on' : '');

      const disabledAttr = phaseLocked ? 'disabled' : '';
      const lockedClick = phaseLocked ? '' : `onclick="cycleTaskDone(${ctxStr},${ti})"`;
      const naClick = phaseLocked ? '' : `onclick="toggleNa(${ctxStr},${ti})"`;

      html += `<div class="${rowCls}">
        <div class="tri-cell">
          <button class="${triBtnCls}" ${lockedClick} title="${t('statDone')}">${triGlyph}</button>
          <button class="${naCls}" ${naClick} title="${t('naAria')}">${t('naLabel')}</button>
        </div>
        <div>
          <div class="task-name">${escH(task.deliverable)}${customTag}</div>
          <div class="task-rasci">${tags || (fullTask.custom?'<span style="font-size:11px;color:#888">—</span>':'')}</div>
        </div>
        <div class="task-link-wrap">
          <input type="text" placeholder="${t('linkPlaceholder')||'Link…'}" value="${escH(fullTask.link)}"
            class="${fullTask.link?'filled':''}" ${disabledAttr}
            oninput="updateLink(${ctxStr},${ti},this.value)">
        </div>
        <div class="task-aside">
          <div class="task-reorder">
            ${ti>0?`<button class="reorder-btn" onclick="moveTask(${ctxStr},${ti},-1)">▲</button>`:'<span> </span>'}
            ${ti<tasks.length-1?`<button class="reorder-btn" onclick="moveTask(${ctxStr},${ti},1)">▼</button>`:'<span> </span>'}
          </div>
          ${fullTask.custom ? `<button class="delete-btn" onclick="deleteCustomRow(${ctxStr},${ti})" title="${t('deleteRowConfirm')}">🗑</button>` : ''}
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

// ── Export panel ─────────────────────────────────────────────────────────────
function renderExportPanel(){
  let total=0, done=0, na=0, link=0;
  const collect = arr => {
    const rel = relevantTasks(arr);
    rel.forEach(x => {
      total++;
      if (x.status==='done') done++;
      else if (x.status==='na') na++;
      if (x.link) link++;
    });
  };
  state.cityOrder.forEach(n => collect(state.cities[n].tasks));
  state.projectOrder.forEach(n => state.projects[n].phases.forEach(p => collect(p.tasks)));
  const open = total - done - na;

  const oc = document.getElementById('open-count');
  oc.textContent = open + ' ' + t('statOpen').toLowerCase();
  oc.style.display = open > 0 ? 'inline' : 'none';

  return `<div class="export-panel">
    <div>
      <strong style="font-size:15px">${t('exportTitle')}</strong>
      <p>${t('exportDesc')}</p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px">
      <div class="stats">
        <div class="stat-item"><div class="val green">${done}</div><div class="lbl">${t('statDone')}</div></div>
        <div class="stat-item"><div class="val grey">${na}</div><div class="lbl">${t('statNa')}</div></div>
        <div class="stat-item"><div class="val red">${open}</div><div class="lbl">${t('statOpen')}</div></div>
        <div class="stat-item"><div class="val">${link}</div><div class="lbl">${t('statLink')}</div></div>
      </div>
      <button class="btn success" onclick="exportExcel()">${t('exportBtn')}</button>
    </div>
  </div>`;
}

// ── Actions ──────────────────────────────────────────────────────────────────
function goBack(){
  if (state.view){ state.view = null; renderApp(); return; }
  state.setupDone = false; renderSetup();
}
function toggleAdmin(){ state.adminMode = !state.adminMode; renderApp(); }
function filterRole(r){ state.role = r; renderApp(); }
function openCity(name){ state.view = {type:'city', id:name}; renderApp(); }
function openProject(name){ state.view = {type:'project', id:name, phaseIdx:0}; renderApp(); }
function selectPhase(pi){ if (state.view && state.view.type==='project'){ state.view.phaseIdx = pi; renderApp(); } }

function cycleTaskDone(ctxType, ctxId, phaseIdx, ti){
  const arr = getTaskArray({ctxType, ctxId, phaseIdx});
  const task = arr[ti];
  // From done -> open; from open -> done; from na -> open (clear N/A first).
  if (task.status === 'done') task.status = 'open';
  else if (task.status === 'na') task.status = 'open';
  else task.status = 'done';
  renderApp();
}

function toggleNa(ctxType, ctxId, phaseIdx, ti){
  const arr = getTaskArray({ctxType, ctxId, phaseIdx});
  const task = arr[ti];
  task.status = task.status === 'na' ? 'open' : 'na';
  renderApp();
}

function updateLink(ctxType, ctxId, phaseIdx, ti, val){
  const arr = getTaskArray({ctxType, ctxId, phaseIdx});
  arr[ti].link = val;
  if (event && event.target) event.target.classList.toggle('filled', !!val);
}

function markAllInList(ctxType, ctxId, phaseIdx, target){
  const arr = getTaskArray({ctxType, ctxId, phaseIdx});
  const rel = relevantTasks(arr);
  rel.forEach(item => {
    const idx = arr.findIndex(x => x.id === item.id);
    if (idx < 0) return;
    if (target === 'done'){
      if (arr[idx].status !== 'na') arr[idx].status = 'done';
    } else {
      if (arr[idx].status !== 'na') arr[idx].status = 'open';
    }
  });
  renderApp();
}

function moveTask(ctxType, ctxId, phaseIdx, ti, dir){
  const arr = getTaskArray({ctxType, ctxId, phaseIdx});
  const ni = ti + dir;
  if (ni < 0 || ni >= arr.length) return;
  // Only reorder within the same blok
  if (arr[ti].blok !== arr[ni].blok || arr[ti].step !== arr[ni].step) return;
  [arr[ti], arr[ni]] = [arr[ni], arr[ti]];
  renderApp();
}

function moveBlok(ctxType, ctxId, phaseIdx, blokKey, dir){
  const arr = getTaskArray({ctxType, ctxId, phaseIdx});
  const order = [...new Set(arr.map(x => x.step + '||' + x.blok))];
  const idx = order.indexOf(blokKey);
  const ni = idx + dir;
  if (ni < 0 || ni >= order.length) return;
  [order[idx], order[ni]] = [order[ni], order[idx]];
  const groups = {};
  arr.forEach(x => { const k = x.step+'||'+x.blok; (groups[k]=groups[k]||[]).push(x); });
  setTaskArray({ctxType, ctxId, phaseIdx}, order.flatMap(k => groups[k] || []));
  renderApp();
}

function promptAddRow(ctxType, ctxId, phaseIdx, blokKey){
  const name = window.prompt(t('addRowPrompt'));
  if (!name || !name.trim()) return;
  const arr = getTaskArray({ctxType, ctxId, phaseIdx});
  const newTask = makeCustomTask(blokKey, name.trim());
  // Insert after the last task in that blok
  let insertAt = arr.length;
  for (let i = arr.length - 1; i >= 0; i--){
    if (arr[i].step + '||' + arr[i].blok === blokKey){ insertAt = i + 1; break; }
  }
  arr.splice(insertAt, 0, newTask);
  renderApp();
}

function deleteCustomRow(ctxType, ctxId, phaseIdx, ti){
  const arr = getTaskArray({ctxType, ctxId, phaseIdx});
  if (!arr[ti] || !arr[ti].custom) return;
  if (!window.confirm(t('deleteRowConfirm'))) return;
  arr.splice(ti, 1);
  renderApp();
}

// ── Phase approval ───────────────────────────────────────────────────────────
function submitPhase(name, pi){
  const ph = state.projects[name].phases[pi];
  if (!isPhaseReady(ph)) return;
  ph.submitted = true;
  renderApp();
}
function withdrawPhase(name, pi){
  state.projects[name].phases[pi].submitted = false;
  renderApp();
}
function approvePhase(name, pi){
  if (!isApprover()) { alert(t('needsApprover')); return; }
  const ph = state.projects[name].phases[pi];
  ph.submitted = false;
  ph.approved = true;
  renderApp();
}
function rejectPhase(name, pi){
  if (!isApprover()) { alert(t('needsApprover')); return; }
  state.projects[name].phases[pi].submitted = false;
  renderApp();
}
function reopenPhase(name, pi){
  if (!isApprover()) { alert(t('needsApprover')); return; }
  const proj = state.projects[name];
  // reopening cascades: any later approved phases stay, but unlock state depends only on this phase.
  // Per requirement we just clear approval. Let user re-approve.
  proj.phases[pi].approved = false;
  proj.phases[pi].submitted = false;
  renderApp();
}

// ── Add city / project ───────────────────────────────────────────────────────
function promptAddCity(){
  const name = window.prompt(t('namePromptCity'));
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  if (state.cities[trimmed]) { alert(t('duplicateName')); return; }
  addCityInternal(trimmed);
  state.view = {type:'city', id: trimmed};
  renderApp();
}
function promptAddProject(){
  const name = window.prompt(t('namePromptProject'));
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  if (state.projects[trimmed]) { alert(t('duplicateName')); return; }
  addProjectInternal(trimmed);
  state.view = {type:'project', id: trimmed, phaseIdx:0};
  renderApp();
}

// ── Excel export ─────────────────────────────────────────────────────────────
function statusToText(s){ return s==='done' ? 'Klaar/Done' : s==='na' ? 'N.v.t./N/A' : 'Open'; }

function exportExcel(){
  const wb = XLSX.utils.book_new();
  const today = new Date().toLocaleDateString('nl-NL');

  const intro = XLSX.utils.aoa_to_sheet([
    ['Fasedocument Tracker — Export'],[''],
    ['Export: ' + today],
    ['Steden / Cities: ' + state.cityOrder.join(', ')],
    ['Projecten / Projects: ' + state.projectOrder.join(', ')],
  ]);
  XLSX.utils.book_append_sheet(wb, intro, 'Overview');

  const header = ['Step','Blok','Deliverable','Status','Link','R','A','S','C','I','Custom'];

  state.cityOrder.forEach(name => {
    const rows = [['City: ' + name],[],header];
    state.cities[name].tasks.forEach(x => {
      rows.push([x.step, x.blok, x.deliverable, statusToText(x.status), x.link||'', x.r, x.a, x.s, x.c, x.i, x.custom?'yes':'']);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:8},{wch:32},{wch:46},{wch:14},{wch:36},{wch:6},{wch:6},{wch:6},{wch:6},{wch:6},{wch:8}];
    const safe = ('City_' + name).replace(/[^a-zA-Z0-9_]/g,'_').slice(0,30);
    XLSX.utils.book_append_sheet(wb, ws, safe);
  });

  state.projectOrder.forEach(pname => {
    state.projects[pname].phases.forEach((phase, pi) => {
      const sheetName = PROJECT_PHASES[pi].sheet;
      const status = phase.approved ? 'Approved' : phase.submitted ? 'Submitted' : 'In progress';
      const rows = [
        ['Project: ' + pname],
        ['Phase ' + (pi+1) + ': ' + sheetName],
        ['Phase status: ' + status],
        [], header,
      ];
      phase.tasks.forEach(x => {
        rows.push([x.step, x.blok, x.deliverable, statusToText(x.status), x.link||'', x.r, x.a, x.s, x.c, x.i, x.custom?'yes':'']);
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:8},{wch:32},{wch:46},{wch:14},{wch:36},{wch:6},{wch:6},{wch:6},{wch:6},{wch:6},{wch:8}];
      const tabName = (pname.slice(0,10) + '_P' + (pi+1) + '_' + sheetName).replace(/[^a-zA-Z0-9_]/g,'_').slice(0,30);
      XLSX.utils.book_append_sheet(wb, ws, tabName);
    });
  });

  const date = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `fasedocument_v2_${date}.xlsx`);
}

init();
</script>
